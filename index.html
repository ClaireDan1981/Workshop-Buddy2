
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b36"><title>Workshop Buddy · Kehoe’s Car Garage</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18303b;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}header{background:#142b36;color:white;padding:20px max(18px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(23px,3vw,32px);margin:0}header p{margin:4px 0 0;color:#b6cbd0}nav{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{cursor:pointer}nav button{border:1px solid #637b83;background:transparent;color:white;padding:12px 18px;border-radius:12px;font-weight:750;min-height:48px}nav button.active{background:#c7f36b;color:#193322;border-color:#c7f36b}main{max-width:1200px;margin:auto;padding:24px 16px 70px}.heading{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}.heading h2{margin:0;font-size:26px}.muted{color:#60737b}.pill{background:#e3ebeb;padding:9px 13px;border-radius:30px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}.stat{background:white;padding:18px;border-radius:15px;border:1px solid #dce5e4}.stat strong{font-size:31px;display:block}.stat span{color:#576d75}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}.card{background:white;border:1px solid #dce5e4;border-radius:17px;padding:19px;box-shadow:0 3px 10px #132b3210}.card.overdue{border:3px solid #df4949;background:#fff0ee}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.reg{font-weight:900;font-size:25px;letter-spacing:.3px}.job{color:#667a80;font-size:13px;font-weight:700}.vehicle{margin:8px 0 15px;color:#4d646b}.stage{display:inline-block;padding:9px 12px;border-radius:10px;background:#e7edf0;font-weight:800;font-size:14px}.stage.s2{background:#ffeed0;color:#875514}.stage.s4{background:#d9f4da;color:#235e33}.stage.s3{background:#dceafe;color:#214e8a}.note{line-height:1.5;min-height:42px;color:#425962}.advance{display:block;width:100%;min-height:76px;border:0;border-radius:13px;background:#c7f36b;color:#173525;font-weight:900;font-size:19px;margin-top:14px;touch-action:manipulation}.advance:active{transform:scale(.99)}.advance:disabled{background:#e8eded;color:#58696e;cursor:default}.secondary{border:1px solid #a7b9bd;background:white;border-radius:10px;padding:11px 15px;font-weight:750;min-height:44px}.group{margin:24px 0}.group h3{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #dce5e4;padding-bottom:12px}.count{background:#dce7e7;border-radius:20px;padding:4px 11px}.search-box{max-width:510px;background:white;padding:24px;border-radius:18px;border:1px solid #dce5e4}.field{display:block;font-weight:750;margin:14px 0 6px}.search-box input{width:100%;border:2px solid #a6b8bc;border-radius:11px;padding:15px;font-size:18px;text-transform:uppercase}.primary{border:0;background:#142b36;color:white;padding:16px 22px;border-radius:11px;font-weight:800;margin-top:18px;min-height:55px;width:100%}.result{margin-top:22px;max-width:510px}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:20px 0}.progress div{height:11px;background:#dce4e5;border-radius:10px}.progress div.done{background:#73b34b}.empty{padding:20px;background:white;border-radius:14px;color:#5a7077}.warning{font-weight:850;color:#b62424}.small{font-size:13px}.footer{margin-top:40px;color:#6b7e83;font-size:13px}.hidden{display:none!important}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#142b36;color:white;padding:14px 22px;border-radius:12px;box-shadow:0 5px 25px #0004;z-index:5;max-width:90vw} @media(max-width:600px){header{padding:18px}nav{width:100%}nav button{flex:1;padding:12px 8px}main{padding:18px 12px 50px}.advance{min-height:82px}.cards{grid-template-columns:1fr}}
</style></head><body><header><div><h1>🔧 Workshop Buddy</h1><p>Kehoe’s Car Garage · Enniscorthy, Co. Wexford</p></div><nav aria-label="Views"><button data-view="workshop" class="active">Workshop</button><button data-view="customer">Customer</button><button data-view="office">Office</button></nav></header><main><section id="workshop"></section><section id="customer" class="hidden"></section><section id="office" class="hidden"></section><p class="footer">Internal alpha · Sample jobs only · Stored on this device · Not connected to SMS or a live garage system</p></main><div id="toast" class="hidden" role="status"></div><script>
'use strict';
const STAGES=['Booked in','Being checked','Waiting for parts','Being fixed','Ready to collect'];
const KEY='workshop-buddy-alpha-v1';
const now=Date.now(),day=86400000;
const seed=[
{id:'KB-1041',reg:'241-WX-1842',car:'Toyota Corolla',stage:0,note:'Your car is booked in and waiting for its first check.',since:now-2*3600000},
{id:'KB-1042',reg:'181-WX-926',car:'Volkswagen Golf',stage:1,note:'We are checking the issue and will update your status.',since:now-3*3600000},
{id:'KB-1043',reg:'152-WX-3481',car:'Ford Focus',stage:2,note:'We are waiting for a replacement part before work can continue.',since:now-4.5*day},
{id:'KB-1044',reg:'201-WX-772',car:'Hyundai Tucson',stage:3,note:'Repairs are underway in the workshop.',since:now-4*3600000},
{id:'KB-1045',reg:'171-WX-2050',car:'Skoda Octavia',stage:4,note:'Your car is ready. Please contact the garage to arrange collection.',since:now-day},
{id:'KB-1046',reg:'221-WX-607',car:'Kia Sportage',stage:2,note:'We are waiting for a replacement part before work can continue.',since:now-1.2*day},
{id:'KB-1047',reg:'191-WX-5114',car:'Nissan Qashqai',stage:4,note:'Your car is ready. Please contact the garage to arrange collection.',since:now-2*3600000},
{id:'KB-1048',reg:'161-WX-918',car:'Opel Astra',stage:0,note:'Your car is booked in and waiting for its first check.',since:now-3600000}
];
let jobs;try{const stored=JSON.parse(localStorage.getItem(KEY));jobs=Array.isArray(stored)&&stored.length?stored:seed}catch{jobs=seed}
const $=s=>document.querySelector(s);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const days=j=>(Date.now()-j.since)/day;const overdue=j=>j.stage===2&&days(j)>2;
const defaultNote=i=>['Your car is booked in and waiting for its first check.','We are checking your car and will update its progress.','We are waiting for a replacement part before work can continue.','Repairs are underway in the workshop.','Your car is ready. Please contact the garage to arrange collection.'][i];
const stageTag=j=>`<span class="stage s${j.stage}">${STAGES[j.stage]}</span>`;
function card(j,workshop=false){return `<article class="card ${overdue(j)?'overdue':''}"><div class="card-top"><div><div class="job">${escapeHTML(j.id)}</div><div class="reg">${escapeHTML(j.reg)}</div></div>${stageTag(j)}</div><div class="vehicle">${escapeHTML(j.car)}</div>${overdue(j)?`<p class="warning">⚠ Waiting ${Math.floor(days(j))} days — follow up on parts/customer</p>`:''}<p class="note">${escapeHTML(j.note)}</p>${workshop?`<button class="advance" data-advance="${escapeHTML(j.id)}" ${j.stage===4?'disabled':''}>${j.stage===4?'✓ Ready for collection':'Next: '+STAGES[j.stage+1]+' →'}</button>`:''}</article>`}
function renderWorkshop(){const ready=jobs.filter(j=>j.stage===4).length;$('#workshop').innerHTML=`<div class="heading"><div><h2>Today’s workshop</h2><div class="muted">Tap once to move a car forward. No typing needed.</div></div><span class="pill">${jobs.length} jobs on board</span></div><div class="stats"><div class="stat"><strong>${jobs.length-ready}</strong><span>Jobs in progress</span></div><div class="stat"><strong>${jobs.filter(j=>j.stage===2).length}</strong><span>Waiting for parts</span></div><div class="stat"><strong>${ready}</strong><span>Ready to collect</span></div></div><div class="cards">${jobs.map(j=>card(j,true)).join('')}</div>`}
function renderOffice(){const overdueCount=jobs.filter(overdue).length,ready=jobs.filter(j=>j.stage===4).length;$('#office').innerHTML=`<div class="heading"><div><h2>Office overview</h2><div class="muted">Grouped by stage · Red means parts waiting longer than 2 days</div></div><button class="secondary" id="reset">Reset demo data</button></div><div class="stats"><div class="stat"><strong>${ready}</strong><span>Ready, not collected</span></div><div class="stat"><strong>${overdueCount}</strong><span>Overdue parts follow-ups</span></div><div class="stat"><strong>${jobs.length}</strong><span>Open jobs</span></div></div>${STAGES.map((s,i)=>{const group=jobs.filter(j=>j.stage===i).sort((a,b)=>Number(overdue(b))-Number(overdue(a)));return `<section class="group"><h3>${s}<span class="count">${group.length}</span></h3>${group.length?`<div class="cards">${group.map(j=>card(j)).join('')}</div>`:'<p class="muted">No cars at this stage.</p>'}</section>`}).join('')}`;$('#reset').onclick=()=>{if(confirm('Reset all sample jobs to their original stages?')){jobs=seed.map(j=>({...j}));save();renderAll();toast('Demo jobs reset')}}}
function renderCustomer(){ $('#customer').innerHTML=`<div class="heading"><div><h2>Check your car’s progress</h2><p class="muted">Enter your job number and registration to see your own update.</p></div></div><div class="search-box"><form id="lookup"><label class="field" for="job">Job number</label><input id="job" required autocomplete="off" placeholder="e.g. KB-1043"><label class="field" for="reg">Car registration</label><input id="reg" required autocomplete="off" placeholder="e.g. 152-WX-3481"><button class="primary" type="submit">Check status →</button></form><p class="small muted">Demo example: KB-1043 / 152-WX-3481</p></div><div id="customer-result" class="result" aria-live="polite"></div>`;$('#lookup').onsubmit=e=>{e.preventDefault();const norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');const j=jobs.find(x=>norm(x.id)===norm($('#job').value)&&norm(x.reg)===norm($('#reg').value));$('#customer-result').innerHTML=j?`<article class="card"><div class="job">${escapeHTML(j.id)}</div><div class="reg">${escapeHTML(j.reg)}</div><div class="vehicle">${escapeHTML(j.car)}</div>${stageTag(j)}<div class="progress" aria-label="Stage ${j.stage+1} of 5">${STAGES.map((_,i)=>`<div class="${i<=j.stage?'done':''}"></div>`).join('')}</div><p class="note">${escapeHTML(j.note)}</p></article>`:'<div class="empty" role="alert">No matching job found. Check both details and try again, or contact the garage.</div>'}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(jobs))}catch{toast('Changes could not be saved on this device')}}function toast(message){const t=$('#toast');t.textContent=message;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2400)}
function renderAll(){renderWorkshop();renderOffice();renderCustomer()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-advance]');if(!b)return;const j=jobs.find(x=>x.id===b.dataset.advance);if(!j||j.stage>=4)return;j.stage++;j.since=Date.now();j.note=defaultNote(j.stage);save();renderWorkshop();renderOffice();toast(`${j.reg}: ${STAGES[j.stage]}`)});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));['workshop','customer','office'].forEach(v=>$('#'+v).classList.toggle('hidden',v!==b.dataset.view));window.scrollTo(0,0)}));renderAll();
</script></body></html>
